<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exercício — Correção Bootstrap + Componentização React (Aula 08)</title>


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f1f5f9;
    }

    .card-maquina {
      border-left: 6px solid #0d6efd;
    }

    .card-maquina.manutencao {
      border-left-color: #fd7e14;
    }

    .card-maquina.parada {
      border-left-color: #dc3545;
    }

    .badge-status {
      font-size: 0.75rem;
    }

    .rodape {
      background: #0f172a;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container py-4">

    <h1 class="h3 mb-1">
      Exercício — Correção Bootstrap + Componentização
    </h1>

    <p class="text-muted mb-4">
      Correção dos erros de formatação e componentização dos cards com React.
    </p>

    
    <div id="root"></div>

  </div>



  <script
    crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script
    crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@babel/standalone/babel.min.js">
  </script>


  <script type="text/babel">

   
    const maquinas = [
      {
        id: 1,
        nome: "Prensa Hidráulica P-01",
        oee: 92,
        status: "Ativa",
        producao: 120
      },

      {
        id: 2,
        nome: "Torno CNC T-02",
        oee: 71,
        status: "Ativa",
        producao: 240
      },

      {
        id: 3,
        nome: "Esteira E-03",
        oee: 64,
        status: "Manutenção",
        producao: 360
      },

      {
        id: 4,
        nome: "Caldeira C-04",
        oee: 88,
        status: "Ativa",
        producao: 480
      }
    ];


    
    function CardMaquina({ nome, oee, status }) {

      
      const classeCard =
        status === "Manutenção"
          ? "manutencao"
          : status === "Parada"
          ? "parada"
          : "";


      
      const classeBadge =
        status === "Ativa"
          ? "text-bg-success"
          : status === "Manutenção"
          ? "text-bg-warning"
          : "text-bg-danger";


      return (
        <div className={"card card-maquina h-100 " + classeCard}>

          <div className="card-body">

            <h5 className="card-title">
              {nome}
            </h5>

            <p className="display-6 fw-bold text-primary">
              {oee}%
            </p>

            <p className="text-muted small mb-2">
              OEE (Eficiência Global)
            </p>

            <span
              className={
                "badge rounded-pill badge-status " + classeBadge
              }
            >
              {status}
            </span>

          </div>

        </div>
      );
    }


   
    function App() {

      return (

        <div className="container">


          <h1 className="h3 mb-3">
            Sistema de Monitoramento
          </h1>


  

          <div
            className="alert alert-warning d-flex align-items-center"
            role="alert"
          >

            <span className="me-2">
              &#9888;&#65039;
            </span>

            <div>

              <strong>
                Manutenção programada:
              </strong>

              {" "}
              a Esteira E-03 será desligada amanhã às 14h
              para revisão preventiva.

            </div>

          </div>



         

          <div className="row g-3">

            {maquinas.map(maquina => (

              <div
                className="col-md-3"
                key={maquina.id}
              >

                <CardMaquina
                  nome={maquina.nome}
                  oee={maquina.oee}
                  status={maquina.status}
                />

              </div>

            ))}

          </div>



       

          <div className="card mt-4">

            <div className="card-header fw-bold">
              Indicadores de Produção
            </div>


            <div className="table-responsive">

              

              <table className="table table-striped mb-0">

                <thead>

                  <tr>

                    <th>Máquina</th>

                    <th>OEE</th>

                    <th>Status</th>

                    <th>Produção (un/h)</th>

                  </tr>

                </thead>


                <tbody>

                  {maquinas.map(maquina => (

                    <tr key={maquina.id}>

                      <td>
                        {maquina.nome}
                      </td>

                      <td>
                        {maquina.oee}%
                      </td>

                      <td>

                        <span
                          className={
                            "badge rounded-pill badge-status " +

                            (
                              maquina.status === "Ativa"

                                ? "text-bg-success"

                                : maquina.status === "Manutenção"

                                ? "text-bg-warning"

                                : "text-bg-danger"
                            )
                          }
                        >

                          {maquina.status}

                        </span>

                      </td>

                      <td>
                        {maquina.producao}
                      </td>

                    </tr>

                  ))}

                </tbody>

              </table>

            </div>

          </div>



          <footer className="rodape text-center py-3 mt-4 rounded">

            <small>
              Factory Insight · Sistema de Monitoramento · Aula 08
            </small>

          </footer>

        </div>

      );
    }


    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(<App />);

  </script>

</body>
</html>
